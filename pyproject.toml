[project]
name = "arc-mem-bridge"
version = "0.1.0"
description = "ARC-MEM Bridge v0.1: local integration layer for Hermes, Hindsight, MemGraphRAG, H-MEM and PostgreSQL."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "networkx>=3.3",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
