<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>DENUDATA.IO — Bonjour Stéphane</title>
<style>
  :root {
    --bg: #050505;
    --panel: #0f0f10;
    --border: #262622;
    --cream: #f2ecdc;
    --cream-dim: #cfc9b8;
    --accent: #c9a24b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }
  .hero {
    text-align: center;
    padding: 36px 20px 10px;
  }
  .hero h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 46px;
    letter-spacing: 1px;
    margin: 0;
  }
  .hero .date {
    color: var(--cream-dim);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .logo-wrap {
    display: flex;
    justify-content: center;
    margin: 18px 0 6px;
  }
  .logo-wrap img {
    max-width: 260px;
    max-height: 130px;
  }
  .brand-fallback {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--cream-dim);
  }
  .brand-fallback small {
    display: block;
    font-family: "Segoe UI", sans-serif;
    letter-spacing: 4px;
    font-size: 10px;
    color: #8a8577;
    margin-top: 4px;
  }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 10px 24px 60px;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
  }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  section.panel h2 {
    font-family: Georgia, serif;
    font-weight: 400;
    font-size: 18px;
    margin: 0 0 14px;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .agenda-full { grid-column: 1 / -1; }
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .day-col {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    min-height: 90px;
  }
  .day-col.today {
    border-color: var(--accent);
    background: rgba(201, 162, 75, 0.08);
  }
  .day-col .day-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--cream-dim);
  }
  .day-col .day-date {
    font-size: 11px;
    color: #6f6a5c;
    margin-bottom: 6px;
  }
  .entry {
    font-size: 12px;
    padding: 4px 6px;
    margin-top: 4px;
    border-radius: 5px;
    background: #1a1a17;
    line-height: 1.3;
  }
  .entry.src-google { border-left: 3px solid #5b9bd5; }
  .entry.src-vikunja { border-left: 3px solid var(--accent); }
  .empty-day { font-size: 11px; color: #55523f; }
  ul.task-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 360px;
    overflow-y: auto;
  }
  ul.task-list li {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  ul.task-list li:last-child { border-bottom: none; }
  .empty-state { color: var(--cream-dim); font-size: 13px; }
  .night-panel textarea {
    width: 100%;
    min-height: 70px;
    resize: vertical;
    background: #171612;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--cream);
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
  }
  .night-panel button {
    margin-top: 10px;
    background: var(--accent);
    color: #1a1508;
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .night-panel button:disabled { opacity: 0.5; cursor: default; }
  .night-status {
    margin-top: 10px;
    font-size: 13px;
    min-height: 18px;
  }
  .night-status.ok { color: #8fd19e; }
  .night-status.err { color: #e0847a; }
  .banner-error {
    grid-column: 1 / -1;
    background: #2a1414;
    border: 1px solid #5a2b2b;
    color: #e0847a;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="hero">
    <h1>Bonjour Stéphane</h1>
    <div class="date" id="generated-at"></div>
  </div>

  <div class="logo-wrap">
    <img src="../assets/logo.png" alt="DENUDATA.IO"
         onerror="this.style.display='none'; document.getElementById('brand-fallback').style.display='block';" />
    <div class="brand-fallback" id="brand-fallback" style="display:none;">
      DENUDATA.IO
      <small>SPACE, BORDER OF INFINITY</small>
    </div>
  </div>

  <main id="main-content">
    <div id="error-slot"></div>

    <section class="panel agenda-full">
      <h2>Agenda de la semaine</h2>
      <div class="week-grid" id="week-grid"></div>
    </section>

    <section class="panel">
      <h2>Tâches à réaliser</h2>
      <ul class="task-list" id="task-list"></ul>
    </section>

    <section class="panel night-panel">
      <h2>Idées de la nuit</h2>
      <textarea id="night-input" placeholder="Une idée qui t'est venue cette nuit ? Note-la ici, elle part directement dans Vikunja."></textarea>
      <div>
        <button id="night-submit">Ajouter la tâche</button>
      </div>
      <div class="night-status" id="night-status"></div>
    </section>
  </main>

  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function renderDashboard(data) {
      document.getElementById("generated-at").textContent = data.generated_at || "";

      const errorSlot = document.getElementById("error-slot");
      errorSlot.innerHTML = data.error
        ? `<div class="banner-error">${escapeHtml(data.error)}</div>`
        : "";

      const weekGrid = document.getElementById("week-grid");
      weekGrid.innerHTML = "";
      (data.week || []).forEach((day) => {
        const col = document.createElement("div");
        col.className = "day-col" + (day.is_today ? " today" : "");
        let html = `<div class="day-label">${escapeHtml(day.label)}</div><div class="day-date">${escapeHtml(day.date)}</div>`;
        if (!day.entries || day.entries.length === 0) {
          html += `<div class="empty-day">—</div>`;
        } else {
          day.entries.forEach((e) => {
            const cls = e.source === "Google Calendar" ? "src-google" : "src-vikunja";
            html += `<div class="entry ${cls}">${escapeHtml(e.title)}</div>`;
          });
        }
        col.innerHTML = html;
        weekGrid.appendChild(col);
      });

      const taskList = document.getElementById("task-list");
      taskList.innerHTML = "";
      if (!data.tasks || data.tasks.length === 0) {
        taskList.innerHTML = `<li class="empty-state">Rien en attente — belle semaine.</li>`;
      } else {
        data.tasks.forEach((t) => {
          const li = document.createElement("li");
          li.textContent = t.title;
          taskList.appendChild(li);
        });
      }
    }
    window.renderDashboard = renderDashboard;

    document.getElementById("night-submit").addEventListener("click", async () => {
      const input = document.getElementById("night-input");
      const status = document.getElementById("night-status");
      const button = document.getElementById("night-submit");
      const title = input.value.trim();
      if (!title) return;

      button.disabled = true;
      status.textContent = "Ajout en cours…";
      status.className = "night-status";
      try {
        const result = await window.pywebview.api.add_night_task(title);
        if (result.ok) {
          status.textContent = "Ajoutée à Vikunja.";
          status.className = "night-status ok";
          input.value = "";
        } else {
          status.textContent = result.error || "Échec de l'ajout.";
          status.className = "night-status err";
        }
      } catch (err) {
        status.textContent = "Erreur de communication avec l'application.";
        status.className = "night-status err";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
